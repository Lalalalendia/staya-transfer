[package]
name = "staya-iroh-release-compat"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace]
resolver = "3"

[[test]]
name = "fsstore_compat"
path = "../fsstore_compat.rs"

[[test]]
name = "fsstore_network_get"
path = "../fsstore_network_get.rs"

[[test]]
name = "fsstore_partial_gate"
path = "../fsstore_partial_gate.rs"

[[test]]
name = "fsstore_crash_gate"
path = "../fsstore_crash_gate.rs"

[dependencies]
staya-transfer = { path = "../..", features = ["bao"] }
staya-custody-lab = { path = "../../custody" }
bao-tree = { version = "=0.16.1", default-features = false, features = ["fs"] }
blake3 = "=1.8.5"
iroh = "=1.3.0"
postcard = { version = "=1.1.3", features = ["use-std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }

[[test]]
name = "fsstore_disk_budget_gate"
path = "../fsstore_disk_budget_gate.rs"

[[test]]
name = "fsstore_enospc_gate"
path = "../fsstore_enospc_gate.rs"

[[test]]
name = "fsstore_many_ranges_gate"
path = "../fsstore_many_ranges_gate.rs"

[[bin]]
name = "staya-direct-preview"
path = "../staya_direct_preview.rs"

[[test]]
name = "staya_direct_preview_gate"
path = "../staya_direct_preview_gate.rs"

[[bin]]
name = "staya-store-worker"
path = "../staya_store_worker.rs"

[[test]]
name = "staya_store_worker_gate"
path = "../staya_store_worker_gate.rs"

[target.'cfg(target_os = "linux")'.dependencies]
staya-native-parent-lab = { path = "../../native-host" }

[target.'cfg(windows)'.dependencies]
staya-windows-job-lab = { path = "../../native-windows-host" }

[[test]]
name = "fsstore_async_cancel_gate"
path = "../fsstore_async_cancel_gate.rs"
