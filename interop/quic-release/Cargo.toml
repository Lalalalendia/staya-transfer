[package]
name = "staya-iroh-release-quic"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace]
resolver = "3"

[[test]]
name = "quic_get"
path = "../quic_get.rs"

[dependencies]
staya-transfer = { path = "../..", features = ["bao"] }
bao-tree = { version = "=0.16.1", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
iroh = { version = "=1.3.0", default-features = false }
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }
