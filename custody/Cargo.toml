[package]
name = "staya-custody-lab"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[features]
# Disabled by default; only the isolated GitHub CI SIGKILL laboratory enables it.
g2-cutpoint-lab = []

[workspace]
resolver = "3"

[dependencies]
same-file = "=1.0.6"
blake3 = "=1.8.5"

[[bin]]
name = "staya-custody-worker"
path = "src/bin/worker.rs"
