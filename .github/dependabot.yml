version: 2
updates:
  # Keep workflow action versions current, without automatically changing
  # pinned Rust/Iroh protocol dependencies or production security boundaries.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(actions)"
