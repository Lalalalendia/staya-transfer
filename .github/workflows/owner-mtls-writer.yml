name: STY owner isolated mTLS DENY writer gateway lab

on:
  push:
    branches: ["experiment/sty-online-owner-mtls-writer-*"]
  pull_request:
    paths:
      - "interop/owner-witness-lab/owner_deny_gateway.go"
      - "interop/owner-witness-lab/owner_deny_gateway_test.go"
      - "docs/ADR-0032-mtls-owner-deny-writer-gateway.md"
      - ".github/workflows/owner-mtls-writer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-mtls-deny-writer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23'
          cache: false
      - name: Exact child research scope, no shipped product files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='01be036ff39378da89ed39210489eb0d6508f26f'
          actual=set(subprocess.check_output(['git','diff','--name-only',base+'..HEAD'],text=True).splitlines())
          expected={
            'interop/owner-witness-lab/owner_deny_gateway.go',
            'interop/owner-witness-lab/owner_deny_gateway_test.go',
            'docs/ADR-0032-mtls-owner-deny-writer-gateway.md',
            '.github/workflows/owner-mtls-writer.yml',
            '.github/workflows/owner-signed-deny.yml',
            '.github/workflows/owner-ydb-cas.yml',
            '.github/workflows/owner-remote-quorum.yml',
            '.github/workflows/owner-anchor-gate.yml',
            '.github/workflows/owner-ledger-cas.yml',
            '.github/workflows/owner-witness.yml',
          }
          two_layer={
            '.github/workflows/owner-two-authority.yml',
            'docs/ADR-0033-two-authority-deny-checkpoint.md',
            'interop/owner-witness-lab/owner_two_authority.go',
            'interop/owner-witness-lab/owner_two_authority_test.go',
          }
          worm_layer={
            'interop/owner-witness-lab/owner_worm_audit.go',
            'interop/owner-witness-lab/owner_worm_audit_test.go',
            'docs/ADR-0034-s3-compliance-worm-read-only.md',
            '.github/workflows/owner-worm-audit.yml',
          }
          assert actual in (expected, expected|two_layer, expected|two_layer|worm_layer), ('unexpected writer lab scope',actual^expected)
          assert not any(p.startswith(('src/','custody/','interop/fork/','aquilum-app/')) for p in actual)
          PY
          git diff --check
      - name: Real OS process owner, pinned TLS 1.3, one-CAS and malicious-client tests
        working-directory: interop/owner-witness-lab
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -z "$(gofmt -l .)"
            go test -race -count=1 ./...
          fi
      - name: Explicit release and IAM HOLD
        shell: bash
        run: |
          echo 'This TLS gateway runs only under disposable test identities; no live YDB or separate operator.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The writer token, if compromised, bypasses application-level signed transition validation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No durable monotonic independent root, complete positive grants, File Gate or production P2P writes.' >> "$GITHUB_STEP_SUMMARY"
