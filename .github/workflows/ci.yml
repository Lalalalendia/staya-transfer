name: Rust contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Check compilation before formatting so rustfmt does not hide errors.
      - run: cargo test --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --all -- --check
        if: always()
      # Temporary read-only provenance output. Cargo.lock contains public package
      # versions and checksums, not credentials. Remove after committing the lock.
      - name: Print resolved Cargo.lock for dependency audit
        if: always()
        shell: bash
        run: |
          echo STAYA_LOCKFILE_BEGIN
          if test -f Cargo.lock; then cat Cargo.lock; else echo LOCKFILE_MISSING; fi
          echo STAYA_LOCKFILE_END

