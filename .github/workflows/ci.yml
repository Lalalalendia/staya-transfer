name: Rust contracts
on:
  # Feature pushes are covered by the PR event, avoiding duplicate runs.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Only the newest commit on a PR needs a runner. Branch-independent gates
# remain separately verifiable; main pushes have their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Temporary bootstrap: the exact Cargo-generated lock is printed so it
      # can be committed through the reviewed PR. Remove this step afterward.
      - name: Generate reviewable lockfile
        run: |
          cargo generate-lockfile
          echo STY_CARGO_LOCK_BEGIN
          cat Cargo.lock
          echo STY_CARGO_LOCK_END
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
