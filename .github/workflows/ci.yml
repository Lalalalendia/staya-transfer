name: Rust contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify committed Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Test base contracts without Bao
        run: cargo test --locked --all-targets --no-default-features
      - name: Test Bao proof adapter
        run: cargo test --locked --all-targets --all-features
      - name: Clippy all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustfmt
        run: cargo fmt --all -- --check
        if: always()

  custody-g2-03:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/sty-g2-03-single-writer-custody-20261019'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve G2 test harness Cargo.lock
        shell: bash
        run: |
          cargo generate-lockfile --manifest-path custody/Cargo.toml
          echo STY_G2_CUSTODY_LOCK_BEGIN
          cat custody/Cargo.lock
          echo STY_G2_CUSTODY_LOCK_END
      - name: Rust format
        run: cargo fmt --manifest-path custody/Cargo.toml --all -- --check
      - name: Independent process ownership and kill/restart
        run: cargo test --manifest-path custody/Cargo.toml --locked --all-targets -- --nocapture
      - name: Deny Clippy warnings
        run: cargo clippy --manifest-path custody/Cargo.toml --locked --all-targets -- -D warnings
