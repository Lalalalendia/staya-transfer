name: Rust contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Fast fail on Rustfmt before compilation
        run: cargo fmt --all -- --check
      - name: Verify committed Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Test base contracts without Bao
        run: cargo test --locked --all-targets --no-default-features
      - name: Test Bao proof adapter
        run: cargo test --locked --all-targets --all-features
      - name: Clippy all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
