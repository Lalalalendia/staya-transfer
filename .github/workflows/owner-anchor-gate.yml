name: STY owner anchor checkpoint fail-closed lab

on:
  push:
    branches: ["experiment/sty-online-owner-anchor-*"]
  pull_request:
    paths:
      - "interop/owner-witness-lab/**"
      - "docs/ADR-0028-owner-anchor-commit-order.md"
      - ".github/workflows/owner-anchor-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denial-checkpoint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23'
          cache: false
      - name: Strict bounded diff from owner journal parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='aa2d4d1470d4dc896d27fb63bb22192d9bdbfa01'
          actual=set(subprocess.check_output(['git','diff','--name-only',base+'..HEAD'],text=True).splitlines())
          expected={
            'interop/owner-witness-lab/owner_ledger.go',
            'interop/owner-witness-lab/owner_anchor_gate.go',
            'interop/owner-witness-lab/owner_anchor_gate_test.go',
            '.github/workflows/owner-witness.yml',
            '.github/workflows/owner-ledger-cas.yml',
            '.github/workflows/owner-anchor-gate.yml',
            'docs/ADR-0028-owner-anchor-commit-order.md',
          }
          quorum_layer = {
            'interop/owner-witness-lab/witness.go',
            'interop/owner-witness-lab/owner_remote_quorum.go',
            'interop/owner-witness-lab/owner_remote_quorum_test.go',
            '.github/workflows/owner-remote-quorum.yml',
            'docs/ADR-0029-two-remote-denial-witnesses.md',
          }
          ydb_layer={
            'interop/owner-witness-lab/owner_ydb_docapi.go',
            'interop/owner-witness-lab/owner_ydb_docapi_test.go',
            'docs/ADR-0030-ydb-document-denial-cas.md',
            '.github/workflows/owner-ydb-cas.yml',
          }
          signed_layer={
            'interop/owner-witness-lab/owner_signed_transition.go',
            'interop/owner-witness-lab/owner_signed_transition_test.go',
            'docs/ADR-0031-signed-deny-transition-gateway.md',
            '.github/workflows/owner-signed-deny.yml',
          }
          writer_layer={
            'interop/owner-witness-lab/owner_deny_gateway.go',
            'interop/owner-witness-lab/owner_deny_gateway_test.go',
            'docs/ADR-0032-mtls-owner-deny-writer-gateway.md',
            '.github/workflows/owner-mtls-writer.yml',
          }
          two_layer={
            '.github/workflows/owner-two-authority.yml',
            'docs/ADR-0033-two-authority-deny-checkpoint.md',
            'interop/owner-witness-lab/owner_two_authority.go',
            'interop/owner-witness-lab/owner_two_authority_test.go',
          }
          assert actual in (expected, expected|quorum_layer, expected|quorum_layer|ydb_layer, expected|quorum_layer|ydb_layer|signed_layer, expected|quorum_layer|ydb_layer|signed_layer|writer_layer, expected|quorum_layer|ydb_layer|signed_layer|writer_layer|two_layer), ('out of lab scope', actual)
          assert not any(n.startswith(('src/','custody/','interop/fork/')) for n in actual)
          PY
          git diff --check
      - name: DENY checkpoint, TLS, CAS crash boundary tests
        working-directory: interop/owner-witness-lab
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -z "$(gofmt -l .)"
            go test -race -count=1 ./...
          fi
      - name: Mandatory research-only and fail-closed summary
        shell: bash
        run: |
          echo 'An HTTP Document API client also exists, but only in a local TLS mock; no actual remote trusted CAS is deployed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ledger vs anchor divergence, offline root and ambiguous seal result require HOLD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No real rollback-resistant anchor, full positive policy root, P2P grants, File Gate, APPLIED or ACK.' >> "$GITHUB_STEP_SUMMARY"
