name: Iroh FsStore compatibility
on:
  pull_request:
    paths:
      - 'interop/**'
      - '.github/workflows/iroh-compat.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iroh-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fsstore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [release, fork]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Enforce pinned release/fork Cargo.lock
        run: cargo metadata --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Real FsStore to Staya Bao verification
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
          STY_INTEROP_OUTPUT_DIR: ${{ github.workspace }}/proof-artifact
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_compat -- --exact actual_fsstore_bao_outboard_authenticates_in_staya --nocapture
      - name: Check bounded direct QUIC GET, Bao and denial policy
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
          STY_QUIC_OUTPUT_DIR: ${{ github.workspace }}/wire-artifact
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_network_get -- --exact direct_quic_get_bao_peer_policy_reconnect --nocapture
      - name: STY-G2-02 pinned FsStore partial import, clean reopen and Bao audit
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact pinned_partial_import_clean_reopen_with_physical_bao_audit --nocapture
      - name: STY-G2-05a real FsStore process kill and post-crash Bao readback
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_crash_gate -- --exact real_fsstore_kill_reopen_candidate_gate --nocapture
      - name: STY-G2-05f bounded real FsStore admission and cancellation
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_admission_rejects_before_write_and_releases_after_stage --nocapture
      - name: STY-G2-05g actual pinned FsStore quiescent data budget
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_disk_budget_gate -- --exact real_pinned_fsstore_quiescent_disk_snapshot_has_bounded_refusal --nocapture
      - name: STY-G2-06a authenticated missing-range inventory after clean reopen
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact clean_reopen_authenticated_range_controls_missing_inventory --nocapture
      - name: STY-G2-05h2 real FsStore supervised actor shutdown, owner custody and Bao audit
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_supervised_quiescence_blocks_early_handoff_and_reaudits_bao --nocapture
      - name: STY-G2-05h2 abandoned FsStore actor holds lease until OS process exit
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_abandoned_actor_drop_keeps_os_lock_until_process_exit --nocapture
      - name: STY-G2-06b second direct QUIC GET omits physically validated ranges
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
          STY_G2_06B_OUTPUT_DIR: ${{ github.workspace }}/wire-artifact/resume
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_network_get -- --exact real_second_quic_get_stages_only_unverified_bytes --nocapture
      - name: STY-G2-05h3a real FsStore OS worker clean join and forced kill
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_os_process_supervisor_clean_and_kill --nocapture
      - name: STY-G2-05h3d registered writable child join before real actor quiescence
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_registered_child_join_precedes_actor_quiescence --nocapture
      - name: STY-G2-05h3b real parent hard-kill and orphaned FsStore owner
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_parent_death_fails_closed_without_clean_ack --nocapture
      - name: STY-G2-06c real Linux SIGKILL followed by safe direct QUIC recovery
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
          STY_G2_06C_OUTPUT_DIR: ${{ github.workspace }}/wire-artifact/crash-resume
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_network_get -- --exact linux_killed_receiver_redownloads_uncommitted_or_resumes_verified --nocapture
      - name: STY-G2-06f corrupt real FsStore sidecars and replayed candidates
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_missing_sidecars_and_corruption_refuse_candidate_reaudit --nocapture
      - name: STY-G2-06g2 real FsStore actor-phase SIGKILL and independent Bao audit
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
          STY_G2_06G2_OUTPUT_DIR: ${{ github.workspace }}/wire-artifact/fsstore-cuts
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_phase_sigkill_requires_independent_root_proof --nocapture
      - name: STY-G2-06h kernel ENOSPC in actual FsStore IO (Linux tmpfs)
        shell: bash
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq strace
          fi
          mount_root="${RUNNER_TEMP}/staya-g2-06h-${STY_INTEROP_VARIANT}"
          mkdir -p "$mount_root"
          sudo mount -t tmpfs -o size=32m,mode=0700 tmpfs "$mount_root"
          cleanup() { sudo umount "$mount_root"; rmdir "$mount_root"; }
          trap cleanup EXIT
          sudo chown "$(id -u):$(id -g)" "$mount_root"
          test "$(stat -f -c %T "$mount_root")" = "tmpfs"
          mkdir -p "$mount_root/receiver" "${GITHUB_WORKSPACE}/enospc-trace" "${GITHUB_WORKSPACE}/wire-artifact/enospc"
          export STY_G2_06H_ROOT="$mount_root/receiver"
          export STY_G2_06H_OUTPUT_DIR="${GITHUB_WORKSPACE}/wire-artifact/enospc"
          cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_enospc_gate --no-run
          strace -ff -yy -s 80 -e trace=pwrite64,pwritev,write,writev \
            -o "${GITHUB_WORKSPACE}/enospc-trace/io" \
            cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_enospc_gate \
              -- --exact real_fsstore_enospc_rejects_writer_and_cold_restart --nocapture
          if ! grep -hE '(pwrite64|pwritev|write|writev)\(.*\.(data|obao4|sizes4)>.*= -1 ENOSPC' \
                "${GITHUB_WORKSPACE}"/enospc-trace/io.* \
                > "${GITHUB_WORKSPACE}/wire-artifact/enospc/actor-syscall-proof.log"; then
            echo 'ERROR: actual FsStore sidecar syscall ENOSPC absent' >&2
            exit 1
          fi
          printf 'fsstore_sidecar_write_enospc=true\n' > "${GITHUB_WORKSPACE}/wire-artifact/enospc/actor-errno.txt"
      - name: Preserve raw FsStore ENOSPC syscall traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-enospc-syscalls-${{ matrix.variant }}
          path: enospc-trace/
          if-no-files-found: ignore
          retention-days: 7
      - name: STY-G2-06i real FsStore 64 sparse Bao groups and cold restart
        env:
          STY_INTEROP_VARIANT: ${{ matrix.variant }}
          STY_G2_06I_OUTPUT_DIR: ${{ github.workspace }}/wire-artifact/many-ranges
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_many_ranges_gate -- --exact real_fsstore_many_disjoint_bao_ranges_bound_resources_after_cold_reopen --nocapture
      - name: STY-G1f two real OS processes via direct Iroh QUIC and private staging
      - name: STY-G1f two real OS processes via direct Iroh QUIC and private staging
        env:
          STY_G1F_OUTPUT_DIR: ${{ github.workspace }}/wire-artifact/direct-preview
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test staya_direct_preview_gate -- --exact one_manual_direct_file_two_os_processes_and_unlisted_peer_denied --nocapture
      - name: Strict G1e formatting and lint
        run: |
          cargo fmt --manifest-path interop/${{ matrix.variant }}/Cargo.toml --all -- --check
          cargo clippy --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: wire-${{ matrix.variant }}
          path: wire-artifact/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: proof-${{ matrix.variant }}
          path: |
            proof-artifact/proof.bin
            proof-artifact/manifest.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve actual Cargo dependency resolution
        uses: actions/upload-artifact@v4
        with:
          name: lock-${{ matrix.variant }}
          path: interop/${{ matrix.variant }}/Cargo.lock
          if-no-files-found: error
          retention-days: 7
  byte-for-byte:
    needs: fsstore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-*
          path: proof-output
      - name: Compare fork and release Bao responses
        run: |
          cmp proof-output/proof-release/proof.bin proof-output/proof-fork/proof.bin
          cmp proof-output/proof-release/manifest.txt proof-output/proof-fork/manifest.txt
          echo STY_G1D_RELEASE_FORK_BAO_IDENTICAL=true
  wire-byte-for-byte:
    needs: fsstore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wire-*
          path: wire-output
      - name: Compare actual raw QUIC GET responses between versions
        run: |
          cmp wire-output/wire-release/first.bin wire-output/wire-fork/first.bin
          cmp wire-output/wire-release/second.bin wire-output/wire-fork/second.bin
          cmp wire-output/wire-release/manifest.txt wire-output/wire-fork/manifest.txt
          cmp wire-output/wire-release/resume/inventory.txt wire-output/wire-fork/resume/inventory.txt
          cmp wire-output/wire-release/resume/first.wire wire-output/wire-fork/resume/first.wire
          cmp wire-output/wire-release/resume/missing-0.wire wire-output/wire-fork/resume/missing-0.wire
          cmp wire-output/wire-release/resume/missing-1.wire wire-output/wire-fork/resume/missing-1.wire
          echo STY_G2_06B_RELEASE_FORK_ACTUAL_RESUME_WIRE_IDENTICAL=true
          for f in checkpointed.ranges checkpointed.first.wire checkpointed.0.wire checkpointed.1.wire uncommitted.ranges uncommitted.first.wire uncommitted.0.wire uncommitted.1.wire; do
            cmp "wire-output/wire-release/crash-resume/$f" "wire-output/wire-fork/crash-resume/$f"
          done
          echo STY_G2_06C_RELEASE_FORK_SIGKILL_SAFE_FALLBACK_WIRE_IDENTICAL=true
          cmp wire-output/wire-release/fsstore-cuts/inventory.txt wire-output/wire-fork/fsstore-cuts/inventory.txt
          echo STY_G2_06G2_RELEASE_FORK_ACTOR_CUTS_IDENTICAL=true
          cmp wire-output/wire-release/enospc/inventory.txt wire-output/wire-fork/enospc/inventory.txt
          cmp wire-output/wire-release/enospc/actor-errno.txt wire-output/wire-fork/enospc/actor-errno.txt
          echo STY_G2_06H_RELEASE_FORK_REAL_ENOSPC_IDENTICAL=true
          cmp wire-output/wire-release/many-ranges/inventory.txt wire-output/wire-fork/many-ranges/inventory.txt
          cmp wire-output/wire-release/many-ranges/physical-ranges.txt wire-output/wire-fork/many-ranges/physical-ranges.txt
          echo STY_G2_06I_RELEASE_FORK_64_PHYSICAL_BAO_RANGES_IDENTICAL=true
          cmp wire-output/wire-release/direct-preview/received.bin wire-output/wire-fork/direct-preview/received.bin
          cmp wire-output/wire-release/direct-preview/inventory.txt wire-output/wire-fork/direct-preview/inventory.txt
          echo STY_G1F_RELEASE_FORK_TWO_PROCESS_DIRECT_PREVIEW_IDENTICAL=true
          echo STY_G1E_RELEASE_FORK_WIRE_BAO_IDENTICAL=true
