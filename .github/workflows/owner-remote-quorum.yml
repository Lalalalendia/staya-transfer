name: STY two independently pinned remote denial witnesses (HOLD-only)

on:
  push:
    branches: ["experiment/sty-online-owner-two-witness-*"]
  pull_request:
    paths:
      - "interop/owner-witness-lab/**"
      - "docs/ADR-0029-two-remote-denial-witnesses.md"
      - ".github/workflows/owner-remote-quorum.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-remote-witness-processes:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23'
          cache: false
      - name: Assert exact read-only witness research scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='8bf8da2bf725cb57dbaaf2d640ed43ba4fe292e1'
          changes=set(subprocess.check_output(['git','diff','--name-only',base+'..HEAD'],text=True).splitlines())
          expected={
            'interop/owner-witness-lab/witness.go',
            'interop/owner-witness-lab/owner_anchor_gate.go',
            'interop/owner-witness-lab/owner_remote_quorum.go',
            'interop/owner-witness-lab/owner_remote_quorum_test.go',
            '.github/workflows/owner-remote-quorum.yml',
            '.github/workflows/owner-witness.yml',
            '.github/workflows/owner-ledger-cas.yml',
            '.github/workflows/owner-anchor-gate.yml',
            'docs/ADR-0029-two-remote-denial-witnesses.md',
          }
          ydb_layer={
            'interop/owner-witness-lab/owner_ydb_docapi.go',
            'interop/owner-witness-lab/owner_ydb_docapi_test.go',
            'docs/ADR-0030-ydb-document-denial-cas.md',
            '.github/workflows/owner-ydb-cas.yml',
          }
          signed_layer={
            'interop/owner-witness-lab/owner_signed_transition.go',
            'interop/owner-witness-lab/owner_signed_transition_test.go',
            'docs/ADR-0031-signed-deny-transition-gateway.md',
            '.github/workflows/owner-signed-deny.yml',
          }
          writer_layer={
            'interop/owner-witness-lab/owner_deny_gateway.go',
            'interop/owner-witness-lab/owner_deny_gateway_test.go',
            'docs/ADR-0032-mtls-owner-deny-writer-gateway.md',
            '.github/workflows/owner-mtls-writer.yml',
          }
          assert changes in (expected, expected|ydb_layer, expected|ydb_layer|signed_layer, expected|ydb_layer|signed_layer|writer_layer), ('forbidden path or incomplete YDB research layer',changes)
          assert not any(p.startswith(('src/','custody/','interop/fork/','aquilum-app/')) for p in changes)
          PY
          git diff --check
      - name: Actual separate OS-process mTLS witnesses, replay and rollback tests
        shell: bash
        working-directory: interop/owner-witness-lab
        run: |
          set -euo pipefail
          go test -count=1 -v ./...
          go vet ./...
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -z "$(gofmt -l .)"
            go test -race -count=1 ./...
          fi
      - name: Explicit limitations
        shell: bash
        run: |
          echo 'Two real OS processes, distinct TLS and signing keys; same CI machine, NOT distinct physical custody.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Two remote heads returning the same historical state do NOT prove nonrollbackable monotonicity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only DenialAnchorReader is implemented: no CompareAndSeal, grant, File Gate, APPLIED or ACK.' >> "$GITHUB_STEP_SUMMARY"
