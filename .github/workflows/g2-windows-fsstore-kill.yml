name: STY-G2 real Windows FsStore crash recovery
on:
  pull_request:
    paths:
      - 'interop/**'
      - 'custody/**'
      - '.github/workflows/g2-windows-fsstore-kill.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'interop/**'
      - 'custody/**'
      - '.github/workflows/g2-windows-fsstore-kill.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g2-real-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-fsstore-terminate:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [release, fork]
    env:
      STY_INTEROP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate immutable release/fork Cargo.lock
        run: cargo metadata --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --format-version 1
      - name: Native Windows TerminateProcess + real FsStore + Bao restart audit
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_crash_gate -- --exact real_fsstore_kill_reopen_candidate_gate --nocapture
      - name: G2-05h3b parent TerminateProcess leaves orphaned FsStore worker fail-closed
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_parent_death_fails_closed_without_clean_ack --nocapture
      - name: Strict Windows integration lint
        run: cargo clippy --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --all-targets -- -D warnings
      - name: Windows integration format
        run: cargo fmt --manifest-path interop/${{ matrix.variant }}/Cargo.toml --all -- --check
