name: STY-G2 real Windows FsStore crash recovery
on:
  pull_request:
    paths:
      - 'interop/**'
      - 'custody/**'
      - '.github/workflows/g2-windows-fsstore-kill.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'interop/**'
      - 'custody/**'
      - '.github/workflows/g2-windows-fsstore-kill.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g2-real-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-fsstore-terminate:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [release, fork]
    env:
      STY_INTEROP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate immutable release/fork Cargo.lock
        run: cargo metadata --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --format-version 1
      - name: Native Windows TerminateProcess + real FsStore + Bao restart audit
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_crash_gate -- --exact real_fsstore_kill_reopen_candidate_gate --nocapture
      - name: STY-G2-06d Windows TerminateProcess safe full QUIC re-download
        env:
          STY_G2_06D_OUTPUT_DIR: ${{ github.workspace }}/g2-06d-evidence
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_network_get -- --exact windows_terminated_receiver_requires_new_full_quic_transfer --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: windows-terminate-quic-${{ matrix.variant }}
          path: g2-06d-evidence/
          if-no-files-found: error
      - name: G2-05h3b parent TerminateProcess and orphaned FsStore fail closed
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_parent_death_fails_closed_without_clean_ack --nocapture
      - name: G2-05h3d real Windows child join before pinned actor shutdown
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test fsstore_partial_gate -- --exact real_fsstore_registered_child_join_precedes_actor_quiescence --nocapture
      - name: STY-G1f actual two-process direct QUIC preview and refused outsider
        env:
          STY_G1F_OUTPUT_DIR: ${{ github.workspace }}/g1f-private-preview
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test staya_direct_preview_gate -- --exact one_manual_direct_file_two_os_processes_and_unlisted_peer_denied --nocapture
      - name: STY-G1i Windows QUIC reconnect, root and bytes verified
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test staya_direct_preview_gate -- --exact manual_preview_reconnects_real_quic_after_forced_close --nocapture
      - name: STY-G1k Windows real three-item queue staging
        env:
          STY_G1K_OUTPUT_DIR: ${{ github.workspace }}/g1k-ordered-queue
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test staya_direct_preview_gate -- --exact three_explicit_files_real_quic_serial_queue_with_physical_readback --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: windows-queue-preview-${{ matrix.variant }}
          path: g1k-ordered-queue/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-direct-preview-${{ matrix.variant }}
          path: g1f-private-preview/
          if-no-files-found: error
      - name: STY-G2-05h3g native Windows JobObject kill with real pinned FsStore
        run: cargo test --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --test staya_store_worker_gate -- --exact real_fsstore_native_containment_survives_parent_kill --nocapture
      - name: Strict Windows integration lint
        run: cargo clippy --manifest-path interop/${{ matrix.variant }}/Cargo.toml --locked --all-targets -- -D warnings
      - name: Windows integration format
        run: cargo fmt --manifest-path interop/${{ matrix.variant }}/Cargo.toml --all -- --check

  windows-terminate-quic-byte-compare:
    needs: native-fsstore-terminate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-terminate-quic-*
          path: compare
      - name: Compare Windows release and fork actual QUIC Bao bytes
        run: |
          cmp compare/windows-terminate-quic-release/inventory.txt compare/windows-terminate-quic-fork/inventory.txt
          cmp compare/windows-terminate-quic-release/first.wire compare/windows-terminate-quic-fork/first.wire
          cmp compare/windows-terminate-quic-release/redownload-0.wire compare/windows-terminate-quic-fork/redownload-0.wire
          cmp compare/windows-terminate-quic-release/redownload-1.wire compare/windows-terminate-quic-fork/redownload-1.wire
          echo STY_G2_06D_WINDOWS_SAFE_QUIC_FALLBACK_RELEASE_FORK_IDENTICAL=true
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-direct-preview-*
          path: preview
      - name: Compare Windows release/fork real staged preview bytes
        run: |
          cmp preview/windows-direct-preview-release/received.bin preview/windows-direct-preview-fork/received.bin
          cmp preview/windows-direct-preview-release/inventory.txt preview/windows-direct-preview-fork/inventory.txt
          echo STY_G1F_WINDOWS_TWO_PROCESS_PRIVATE_PREVIEW_IDENTICAL=true
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-queue-preview-*
          path: queue
      - name: Compare Windows release/fork three real QUIC queue items
        run: |
          for f in selected-000.bin selected-001.bin selected-002.bin inventory.txt; do
            cmp "queue/windows-queue-preview-release/$f" "queue/windows-queue-preview-fork/$f"
          done
          echo STY_G1K_WINDOWS_RELEASE_FORK_THREE_ACTUAL_QUIC_OBJECTS_IDENTICAL=true
