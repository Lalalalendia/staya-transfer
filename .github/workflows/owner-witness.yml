name: STY owner epoch witness mTLS protocol lab

on:
  push:
    branches: ["experiment/sty-online-owner-witness-*"]
  pull_request:
    paths:
      - "interop/owner-witness-lab/**"
      - "docs/ADR-0026-owner-online-witness.md"
      - ".github/workflows/owner-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-owner-lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23'
          cache: false
      - name: Scope - no shipped Staya or Akula code touched
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines()
          allowed=('.github/workflows/owner-witness.yml','docs/ADR-0026-owner-online-witness.md')
          assert names and all(n in allowed or n.startswith('interop/owner-witness-lab/') for n in names), names
          PY
          git diff --check
      - name: Run Go TLS and separate-owner-process tests
        working-directory: interop/owner-witness-lab
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -z "$(gofmt -l .)"
          fi
      - name: Explicit release HOLD
        shell: bash
        run: |
          echo 'Real TLS test processes are not a deployed trusted owner or tamper-proof monotonic store.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No P2P grants, File Gate writes, receipts, APPLIED or ACK. Product remains HOLD.' >> "$GITHUB_STEP_SUMMARY"
