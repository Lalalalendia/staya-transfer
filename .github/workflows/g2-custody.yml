name: STY-G2 cooperative writer custody
on:
  pull_request:
    paths:
      - 'custody/**'
      - '.github/workflows/g2-custody.yml'
  push:
    branches: [main]
    paths:
      - 'custody/**'
      - '.github/workflows/g2-custody.yml'
permissions:
  contents: read
concurrency:
  group: g2-custody-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  os-writer-custody:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Enforce committed cross-platform Cargo.lock
        shell: bash
        run: cargo metadata --manifest-path custody/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Format gate
        run: cargo fmt --manifest-path custody/Cargo.toml --all -- --check
      - name: OS-process ownership, hardlink and kill regression tests
        run: cargo test --manifest-path custody/Cargo.toml --locked --all-targets -- --nocapture
      # Evidence-only A/B: unlike the ordinary test, this path explicitly
      # issues LOCK_UN. Runs untraced even when the original Drop test fails.
      # Do not interpret this experiment as production custody acceptance.
      - name: Experiment explicit unlock after quiescent owner
        if: always() && github.head_ref == 'feature/sty-g2-05c-lock-identity-no-clone-20261020'
        run: cargo test --manifest-path custody/Cargo.toml --locked --test process explicit_unlock_reacquire_128_with_competing_process -- --exact --nocapture
      # Temporary PR-only forensic step; REMOVE before accepting G2-05d.
      - name: Diagnose Linux flock syscall history after an ownership failure
        if: failure() && runner.os == 'Linux' && github.head_ref == 'feature/sty-g2-05c-lock-identity-no-clone-20261020'
        shell: bash
        run: |
          command -v strace >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq strace)
          set +e
          strace -f -tt -e trace=flock,close,dup,dup2,dup3,openat,fcntl -o "$RUNNER_TEMP/staya-g2-05d-flock.trace" \
            cargo test --manifest-path custody/Cargo.toml --locked --test process repeated_drop_and_reacquire_has_no_stale_lock_descriptor -- --exact --nocapture
          traced_status=$?
          set -e
          echo "STY_G2_05D_STRACE_TEST_EXIT=$traced_status"
          grep 'flock(' "$RUNNER_TEMP/staya-g2-05d-flock.trace" | tail -n 80 || true
      - name: Retain diagnostic Linux syscall trace
        if: failure() && runner.os == 'Linux' && github.head_ref == 'feature/sty-g2-05c-lock-identity-no-clone-20261020'
        uses: actions/upload-artifact@v4
        with:
          name: linux-g2-05d-flock-trace
          path: ${{ runner.temp }}/staya-g2-05d-flock.trace
          if-no-files-found: warn
          retention-days: 3
      - name: Rust Clippy deny warnings
        run: cargo clippy --manifest-path custody/Cargo.toml --locked --all-targets -- -D warnings
